<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - Hotel Booking System</title>
    
    <!-- Google Fonts: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti (สำหรับเอฟเฟกต์พลุ) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Kanit', 'sans-serif'],
              },
              animation: {
                'blob': 'blob 7s infinite',
                'fade-in': 'fadeIn 0.5s ease-out forwards',
              },
              keyframes: {
                blob: {
                  '0%': { transform: 'translate(0px, 0px) scale(1)' },
                  '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                  '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                  '100%': { transform: 'translate(0px, 0px) scale(1)' },
                },
                fadeIn: {
                    '0%': { opacity: '0', transform: 'translateY(10px)' },
                    '100%': { opacity: '1', transform: 'translateY(0)' },
                }
              }
            }
          }
        }
    </script>
    <style>
        body { -ms-overflow-style: none; scrollbar-width: none; }
        body::-webkit-scrollbar { display: none; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }
        
        .input-modern {
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }
        .input-modern:focus {
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
            border-color: #8b5cf6;
        }

        /* Loading Spinner */
        .loader {
            border-top-color: #9333ea;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-800">

    <!-- Background Decoration -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-10 left-10 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
        <div class="absolute top-10 right-10 w-72 h-72 bg-indigo-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>
    </div>
    
    <div class="glass-card rounded-3xl w-full max-w-md p-8 relative z-10">
        
        <!-- Header Section -->
        <div class="text-center mb-8">
            <div class="relative w-20 h-20 mx-auto mb-4 group">
                <div class="absolute inset-0 bg-gradient-to-tr from-violet-500 to-fuchsia-500 rounded-2xl rotate-6 opacity-20 group-hover:rotate-12 transition-transform duration-300"></div>
                <div class="relative bg-white rounded-2xl w-full h-full flex items-center justify-center shadow-sm border border-slate-100">
                    <span class="text-4xl">🔐</span>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">ลืมรหัสผ่าน?</h1>
            <p class="text-slate-500 text-sm mt-2">ไม่ต้องห่วง เราจะช่วยกู้คืนบัญชีให้คุณ</p>
        </div>

        <!-- Modern Loading Overlay -->
        <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/60 backdrop-blur-sm rounded-3xl flex flex-col items-center justify-center z-50 transition-all duration-300">
            <div class="loader ease-linear rounded-full border-4 border-slate-200 h-12 w-12 mb-4"></div>
            <p class="text-slate-700 font-medium animate-pulse">กำลังประมวลผล...</p>
        </div>

        <!-- Step 1: Enter Email -->
        <div id="step1" class="animate-fade-in">
            <form id="forgotForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5 ml-1">อีเมล (Gmail)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">✉️</span>
                        <input type="email" id="email" required 
                            class="input-modern w-full pl-11 pr-4 py-3 border border-slate-200 rounded-xl outline-none text-slate-700 placeholder-slate-400"
                            placeholder="your.email@gmail.com">
                    </div>
                    <p id="emailError" class="text-red-500 text-xs mt-2 ml-1 hidden flex items-center gap-1">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                        <span id="emailErrorText"></span>
                    </p>
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:-translate-y-0.5 transition-all duration-300">
                    ส่งรหัส OTP
                </button>
            </form>
        </div>

        <!-- Step 2: Verify OTP -->
        <div id="step2" class="hidden animate-fade-in">
            <div class="bg-green-50 border border-green-200 rounded-xl p-4 mb-6 flex gap-3 items-start">
                <div class="bg-green-100 p-2 rounded-lg text-xl">📧</div>
                <div>
                    <p class="text-green-800 font-semibold text-sm">ส่ง OTP สำเร็จ!</p>
                    <p class="text-green-600 text-xs mt-1">รหัสถูกส่งไปที่: <span id="emailDisplay" class="font-bold underline"></span></p>
                </div>
            </div>

            <form id="otpForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2 text-center">กรอกรหัส 6 หลัก</label>
                    <input type="text" id="otp" required maxlength="6"
                        class="input-modern w-full px-4 py-4 border-2 border-slate-200 rounded-2xl outline-none text-center text-3xl font-bold tracking-[0.5em] text-indigo-600 placeholder-slate-300 focus:border-indigo-500"
                        placeholder="••••••"
                        autocomplete="off">
                    <p id="otpError" class="text-red-500 text-xs mt-2 text-center hidden"></p>
                </div>

                <div class="flex items-center justify-between text-sm px-1">
                    <div id="countdown" class="text-slate-500 font-medium font-mono"></div>
                    <button type="button" id="resendBtn" onclick="resendOTP()" 
                        class="text-indigo-600 hover:text-indigo-700 font-semibold disabled:text-slate-400 disabled:cursor-not-allowed transition-colors"
                        disabled>
                        ส่งรหัสใหม่
                    </button>
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:-translate-y-0.5 transition-all duration-300">
                    ยืนยัน OTP
                </button>
            </form>
        </div>

        <!-- Step 3: Reset Password (พร้อมปุ่มเปิด/ปิดตา) -->
        <div id="step3" class="hidden animate-fade-in">
            <div class="text-center mb-6">
                 <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-green-100 text-green-600 mb-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="text-lg font-bold text-slate-800">ตั้งรหัสผ่านใหม่</h3>
            </div>

            <form id="resetForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">รหัสผ่านใหม่</label>
                    <div class="relative group">
                        <input type="password" id="newPassword" required 
                            class="input-modern w-full px-4 py-3 pr-12 border border-slate-200 rounded-xl outline-none text-slate-700"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword('newPassword')" 
                            class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors cursor-pointer"
                            title="แสดงรหัสผ่าน">
                            <span class="text-lg leading-none">👁️</span>
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-1 ml-1">ต้องมี 8 ตัวอักษร, พิมพ์ใหญ่, พิมพ์เล็ก, ตัวเลข</p>
                    <p id="newPasswordError" class="text-red-500 text-xs mt-1 ml-1 hidden"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">ยืนยันรหัสผ่านใหม่</label>
                    <div class="relative group">
                        <input type="password" id="confirmPassword" required 
                            class="input-modern w-full px-4 py-3 pr-12 border border-slate-200 rounded-xl outline-none text-slate-700"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword('confirmPassword')" 
                            class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors cursor-pointer"
                            title="แสดงรหัสผ่าน">
                            <span class="text-lg leading-none">👁️</span>
                        </button>
                    </div>
                    <p id="confirmPasswordError" class="text-red-500 text-xs mt-1 ml-1 hidden"></p>
                </div>

                <button type="submit" 
                    class="w-full mt-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-teal-500/30 hover:shadow-teal-500/50 hover:-translate-y-0.5 transition-all duration-300">
                    เปลี่ยนรหัสผ่าน
                </button>
            </form>
        </div>

        <div class="text-center mt-8 pt-6 border-t border-slate-100">
            <a href="/login" class="inline-flex items-center text-sm text-slate-500 hover:text-indigo-600 font-medium transition-colors gap-1 group">
                <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                กลับไปหน้าเข้าสู่ระบบ
            </a>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform scale-100 animate-fade-in">
            <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                <span class="text-4xl">🎉</span>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">เรียบร้อย!</h2>
            <p class="text-slate-500 mb-8">รหัสผ่านของคุณถูกเปลี่ยนแล้ว<br>กรุณาเข้าสู่ระบบใหม่อีกครั้ง</p>
            <button onclick="window.location.href='/login'" 
                class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl font-medium shadow-lg hover:shadow-xl transition-all">
                ไปหน้า Login
            </button>
        </div>
    </div>

    <script>
        // ฟังก์ชัน Toggle Password
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }

        // ฟังก์ชันจุดพลุ (Confetti)
        function fireWorks() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        let resetToken = null;
        let userEmail = null;
        let countdownInterval = null;
        let resendCooldown = 60; 

        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        function startCountdown() {
            let timeLeft = resendCooldown;
            const countdownEl = document.getElementById('countdown');
            const resendBtn = document.getElementById('resendBtn');
            
            resendBtn.disabled = true;
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    countdownEl.textContent = '';
                    resendBtn.disabled = false;
                } else {
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    countdownEl.innerHTML = `<span class="opacity-75">ส่งใหม่ใน</span> ${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        // Step 1: Send OTP
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const emailError = document.getElementById('emailError');
            const emailErrorText = document.getElementById('emailErrorText');
            emailError.classList.add('hidden');

            showLoading(true);

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();
                showLoading(false);

                if (result.success) {
                    userEmail = email;
                    document.getElementById('emailDisplay').textContent = result.maskedEmail;
                    
                    // จุดพลุเล็กน้อยเมื่อส่งสำเร็จ
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });

                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                    
                    startCountdown();
                    
                    setTimeout(() => {
                        document.getElementById('otp').focus();
                    }, 100);
                } else {
                    emailErrorText.textContent = result.message;
                    emailError.classList.remove('hidden');
                }
            } catch (error) {
                showLoading(false);
                console.error('Forgot password error:', error);
                alert('⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อ');
            }
        });

        // Step 2: Verify OTP
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const otp = document.getElementById('otp').value.trim();
            const otpError = document.getElementById('otpError');
            otpError.classList.add('hidden');

            if (otp.length !== 6) {
                otpError.textContent = 'กรุณากรอกรหัส OTP 6 หลัก';
                otpError.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp })
                });

                const result = await response.json();

                if (result.success) {
                    resetToken = result.resetToken;
                    
                    if (countdownInterval) {
                        clearInterval(countdownInterval);
                    }
                    
                    document.getElementById('step2').classList.add('hidden');
                    document.getElementById('step3').classList.remove('hidden');
                } else {
                    otpError.textContent = result.message;
                    otpError.classList.remove('hidden');
                    document.getElementById('otp').value = '';
                    document.getElementById('otp').focus();
                }
            } catch (error) {
                console.error('Verify OTP error:', error);
                alert('⚠️ เกิดข้อผิดพลาด');
            }
        });

        // Step 3: Reset Password
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const newPasswordError = document.getElementById('newPasswordError');
            const confirmPasswordError = document.getElementById('confirmPasswordError');
            
            newPasswordError.classList.add('hidden');
            confirmPasswordError.classList.add('hidden');

            if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}$/.test(newPassword)) {
                newPasswordError.textContent = 'รหัสผ่านต้องมี A-Z, a-z, 0-9 และยาว 8 ตัวขึ้นไป';
                newPasswordError.classList.remove('hidden');
                return;
            }

            if (newPassword !== confirmPassword) {
                confirmPasswordError.textContent = 'รหัสผ่านไม่ตรงกัน';
                confirmPasswordError.classList.remove('hidden');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: userEmail, 
                        resetToken, 
                        newPassword 
                    })
                });

                const result = await response.json();
                showLoading(false);

                if (result.success) {
                    fireWorks(); // จุดพลุฉลอง
                    document.getElementById('successModal').classList.remove('hidden');
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) {
                showLoading(false);
                console.error('Reset password error:', error);
                alert('⚠️ เกิดข้อผิดพลาด');
            }
        });

        // Resend OTP
        async function resendOTP() {
            const resendBtn = document.getElementById('resendBtn');
            if (resendBtn.disabled) return;

            showLoading(true);

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });

                const result = await response.json();
                showLoading(false);

                if (result.success) {
                    document.getElementById('otp').value = '';
                    document.getElementById('otp').focus();
                    if (countdownInterval) clearInterval(countdownInterval);
                    startCountdown();
                    
                    // Small visual feedback
                    resendBtn.textContent = 'ส่งสำเร็จ!';
                    setTimeout(() => {
                        if(resendBtn.disabled) return;
                        resendBtn.textContent = 'ส่งรหัสใหม่';
                    }, 2000);
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) {
                showLoading(false);
                console.error('Resend OTP error:', error);
                alert('⚠️ เกิดข้อผิดพลาด');
            }
        }

        // Auto-format OTP input
        document.getElementById('otp').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
        });
    </script>
</body>
</html>
