<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Hotel Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; }
        
        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }
        
        .glass-sidebar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-600 min-h-screen relative overflow-x-hidden selection:bg-brand-500 selection:text-white">

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed top-5 right-5 z-[150] flex flex-col gap-3 w-full max-w-sm pointer-events-none"></div>

    <!-- NAVBAR -->

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                        <i class="fa-solid fa-crown"></i>
                        <div class="absolute -top-1 -right-1 w-3 h-3 bg-green-400 rounded-full border-2 border-white"></div>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-slate-800 tracking-tight leading-none">HOTEL <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-violet-600">ADMIN</span></h1>
                        <p class="text-xs text-slate-400 font-medium tracking-wide mt-1">PRO DASHBOARD v2.1</p>

                <!-- Right Actions -->

                    </div>
                    <button onclick="toggleSidebar()" class="w-12 h-12 rounded-full bg-slate-100 hover:bg-white hover:shadow-md border border-transparent hover:border-slate-200 flex items-center justify-center text-slate-600 transition-all duration-300">
                        <i class="fa-solid fa-bars-staggered text-lg"></i>

                </div>
            </div>

    </nav>

    <!-- MAIN CONTENT -->

            <!-- Stats will load here -->

             <div class="bg-white p-6 rounded-3xl shadow-sm animate-pulse h-40"></div>
             <div class="bg-white p-6 rounded-3xl shadow-sm animate-pulse h-40"></div>
             <div class="bg-white p-6 rounded-3xl shadow-sm animate-pulse h-40"></div>
        </div>

        <!-- CONTENT PANEL -->
        <div class="glass-panel rounded-[2.5rem] overflow-hidden shadow-xl shadow-slate-200/60 min-h-[600px]">
            
            <!-- Custom Tabs Navigation -->

                <button onclick="switchTab('bookings')" id="tab-bookings" class="flex-1 py-6 text-sm font-bold text-slate-500 hover:text-indigo-600 hover:bg-white/80 transition-all relative group">
                    <span class="flex items-center justify-center gap-3">
                        <i class="fa-solid fa-calendar-check text-xl mb-1 block group-hover:-translate-y-1 transition-transform"></i> 
                        <span class="text-base">รายการจอง</span>
                    </span>
                    <span class="absolute bottom-0 left-0 w-full h-1 bg-indigo-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 rounded-t-full"></span>
                </button>
                <button onclick="switchTab('rooms')" id="tab-rooms" class="flex-1 py-6 text-sm font-bold text-slate-500 hover:text-violet-600 hover:bg-white/80 transition-all relative group">
                    <span class="flex items-center justify-center gap-3">
                        <i class="fa-solid fa-door-open text-xl mb-1 block group-hover:-translate-y-1 transition-transform"></i> 
                        <span class="text-base">จัดการห้องพัก</span>
                    </span>
                    <span class="absolute bottom-0 left-0 w-full h-1 bg-violet-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 rounded-t-full"></span>
                </button>
                <button onclick="switchTab('users')" id="tab-users" class="flex-1 py-6 text-sm font-bold text-slate-500 hover:text-fuchsia-600 hover:bg-white/80 transition-all relative group">
                    <span class="flex items-center justify-center gap-3">
                        <i class="fa-solid fa-users text-xl mb-1 block group-hover:-translate-y-1 transition-transform"></i> 
                        <span class="text-base">ผู้ใช้งาน</span>
                    </span>

            </div>

            <!-- Tab Content Area -->

                <div id="content-bookings" class="tab-content">
                    <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
                        <div>

                            <p class="text-sm text-slate-500">ตรวจสอบและอนุมัติการจองห้องพัก</p>
                        </div>
                        <div class="relative group">

                            <input type="url" id="roomImage4" class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 outline-none text-xs" placeholder="URL รูปเสริม 3">

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let allBookings = [];
        let allRooms = [];
        let allUsers = [];
        let editingRoomOriginalID = null;
        let isRoomNoValid = true;

        // --- TOAST ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const styles = type === 'error' 
                ? 'border-l-4 border-red-500 bg-white text-slate-800' 
                : 'border-l-4 border-green-500 bg-white text-slate-800';
            
            const icon = type === 'error' 
                ? '<i class="fa-solid fa-circle-exclamation text-red-500 text-xl"></i>' 
                : '<i class="fa-solid fa-circle-check text-green-500 text-xl"></i>';

            toast.className = `pointer-events-auto w-full p-4 rounded-xl shadow-2xl shadow-slate-200 flex items-start gap-4 transform translate-x-full transition-transform duration-300 ease-out ${styles}`;
            toast.innerHTML = `
                <div class="shrink-0 mt-0.5">${icon}</div>
                <div class="flex-1">
                    <h4 class="font-bold text-sm">${type === 'error' ? 'เกิดข้อผิดพลาด' : 'สำเร็จ'}</h4>
                    <p class="text-sm text-slate-500 mt-0.5">${message}</p>
                </div>
                <button onclick="this.parentElement.remove()" class="text-slate-300 hover:text-slate-500"><i class="fa-solid fa-times"></i></button>
            `;

            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-full'));

            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // --- INIT ---
        async function checkAuth() {
            try {
                const response = await fetch('/check-session');
                const data = await response.json();
                if (!data.authenticated || data.userType !== 'admin') {
                    window.location.href = '/login.html';
                    return;
                }
                document.getElementById('navAdminName').textContent = data.email.split('@')[0];
                document.getElementById('sidebarEmail').textContent = data.email;
                
                loadStats();
                loadBookings();
            } catch (error) {
                console.error(error);
                window.location.href = '/login.html';
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats');
                const data = await response.json();
                if (data.success) { renderStats(data.stats); }
            } catch (error) { console.error(error); }
        }

        function renderStats(s) {
            const items = [
                { title: 'ห้องพักทั้งหมด', value: s.totalRooms, icon: 'fa-hotel', color: 'text-indigo-600', bg: 'bg-indigo-50', bar: 'bg-indigo-500', w: '100%' },
                { title: 'ห้องว่างพร้อมใช้', value: s.availableRooms, icon: 'fa-check-circle', color: 'text-green-600', bg: 'bg-green-50', bar: 'bg-green-500', w: `${(s.availableRooms/s.totalRooms)*100}%` },
                { title: 'รอการอนุมัติ', value: s.pendingBookings, icon: 'fa-clock', color: 'text-orange-500', bg: 'bg-orange-50', bar: 'bg-orange-500', w: '50%' },
                { title: 'ผู้ใช้งานรวม', value: s.totalUsers, icon: 'fa-users', color: 'text-fuchsia-600', bg: 'bg-fuchsia-50', bar: 'bg-fuchsia-500', w: '100%' }
            ];

            const html = items.map(item => `
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 hover:shadow-xl hover:-translate-y-1 transition duration-300 group overflow-hidden relative">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-white to-slate-100 rounded-bl-full -mr-4 -mt-4 opacity-50 transition-transform group-hover:scale-110"></div>
                    <div class="flex justify-between items-start relative z-10">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">${item.title}</p>
                            <h3 class="text-4xl font-extrabold text-slate-800">${item.value}</h3>
                        </div>
                        <div class="w-14 h-14 ${item.bg} rounded-2xl flex items-center justify-center ${item.color} text-2xl shadow-inner group-hover:rotate-12 transition-transform duration-300">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>
                    </div>
                    <div class="w-full bg-slate-100 h-1.5 mt-6 rounded-full overflow-hidden">
                        <div class="${item.bar} h-full rounded-full transition-all duration-1000" style="width: ${item.w}"></div>
                    </div>
                </div>
            `).join('');
            document.getElementById('statsContainer').innerHTML = html;
        }

        function switchTab(tabName) {
            ['bookings', 'rooms', 'users'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
                const btn = document.getElementById(`tab-${t}`);
                btn.classList.remove('text-indigo-600', 'text-violet-600', 'text-fuchsia-600', 'bg-white/80');
                btn.querySelector('span.absolute').classList.add('scale-x-0');
            });

            const content = document.getElementById(`content-${tabName}`);
            content.classList.remove('hidden');
            content.classList.add('fade-in');
            
            const activeBtn = document.getElementById(`tab-${tabName}`);
            const color = tabName === 'bookings' ? 'text-indigo-600' : (tabName === 'rooms' ? 'text-violet-600' : 'text-fuchsia-600');
            activeBtn.classList.add(color, 'bg-white/80');
            activeBtn.querySelector('span.absolute').classList.remove('scale-x-0');

            if (tabName === 'bookings') loadBookings();
            if (tabName === 'rooms') loadRooms();
            if (tabName === 'users') loadUsers();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('rightSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                requestAnimationFrame(() => overlay.classList.remove('opacity-0'));
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // --- BOOKINGS ---
        async function loadBookings() {
            try {
                const res = await fetch('/api/admin/bookings');
                const data = await res.json();
                if(data.success) { allBookings = data.bookings; filterBookings(); }
            } catch(e) { console.error(e); }
        }

        function filterBookings() {
            const status = document.getElementById('statusFilter').value;
            const filtered = status === 'all' ? allBookings : allBookings.filter(b => b.Status === status);
            renderBookingsTable(filtered);
        }

        function renderBookingsTable(list) {
            const container = document.getElementById('bookingsTable');
            if(list.length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-slate-400"><i class="fa-solid fa-inbox text-5xl mb-4 opacity-20"></i><p>ไม่พบข้อมูลการจอง</p></div>`;
                return;
            }
            let html = `<table class="w-full text-left border-collapse"><thead class="bg-slate-50 text-slate-500 text-xs uppercase font-bold tracking-wider"><tr><th class="p-5">ID</th><th class="p-5">ผู้จอง</th><th class="p-5">ห้องพัก</th><th class="p-5">วันที่เข้า-ออก</th><th class="p-5">ยอดรวม</th><th class="p-5 text-center">สถานะ</th><th class="p-5 text-center">จัดการ</th></tr></thead><tbody class="text-slate-700 divide-y divide-slate-100">`;
            list.forEach(b => {
                const statusStyle = b.Status === 'อนุมัติแล้ว' ? 'bg-green-100 text-green-700 border-green-200' : b.Status === 'ยกเลิก' ? 'bg-red-100 text-red-700 border-red-200' : 'bg-orange-100 text-orange-700 border-orange-200 animate-pulse';
                html += `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="p-5 font-bold text-indigo-600">#${b.Book_ID}</td>
                        <td class="p-5"><div class="font-bold text-slate-800">${b.User_ID}</div><div class="text-xs text-slate-400">Customer</div></td>
                        <td class="p-5"><span class="bg-white border border-slate-200 px-2 py-1 rounded-lg font-mono font-bold text-slate-600">${b.Room_No}</span></td>
                        <td class="p-5 text-sm"><div class="flex items-center gap-2"><i class="fa-solid fa-arrow-right-to-bracket text-green-400"></i> ${b.Check_in}</div><div class="flex items-center gap-2 mt-1"><i class="fa-solid fa-arrow-right-from-bracket text-red-400"></i> ${b.Check_out}</div></td>
                        <td class="p-5 font-bold text-violet-600">฿${Number(b.Total).toLocaleString()}</td>
                        <td class="p-5 text-center"><span class="px-3 py-1 rounded-full text-xs font-bold border ${statusStyle}">${b.Status}</span></td>
                        <td class="p-5 text-center">${b.Status === 'รออนุมัติ' ? `<div class="flex justify-center gap-2"><button onclick="updateBooking('${b.Book_ID}', 'approve')" class="w-8 h-8 rounded-lg bg-green-50 text-green-600 hover:bg-green-500 hover:text-white transition shadow-sm"><i class="fa-solid fa-check"></i></button><button onclick="updateBooking('${b.Book_ID}', 'reject')" class="w-8 h-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-500 hover:text-white transition shadow-sm"><i class="fa-solid fa-xmark"></i></button></div>` : `<span class="text-slate-300 text-xl">•</span>`}</td>
                    </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        async function updateBooking(id, action) {
            if(!confirm(`ยืนยันการ ${action === 'approve' ? 'อนุมัติ' : 'ปฏิเสธ'}?`)) return;
            try {
                const res = await fetch(`/api/admin/bookings/${id}/${action}`, { method: 'PUT' });
                const d = await res.json();
                if(d.success) { showToast('อัปเดตสำเร็จ', 'success'); loadBookings(); loadStats(); }
                else { showToast(d.message, 'error'); }
            } catch(e) { showToast('เชื่อมต่อผิดพลาด', 'error'); }
        }

        // --- ROOMS ---
        async function loadRooms() {
            try {
                const res = await fetch('/api/admin/rooms');
                const data = await res.json();
                if(data.success) { allRooms = data.rooms; renderRoomsGrid(allRooms); }
            } catch(e) { console.error(e); }
        }

        function renderRoomsGrid(list) {
            const container = document.getElementById('roomsGrid');
            if(list.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400"><i class="fa-solid fa-folder-open text-5xl mb-4 opacity-30"></i><p>ยังไม่มีข้อมูลห้องพัก</p></div>`;
                return;
            }
            container.innerHTML = list.map(r => `
                <div class="group bg-white rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 overflow-hidden relative">
                    <div class="relative h-60 overflow-hidden">
                        <img src="${r.Image1 || 'https://via.placeholder.com/400?text=No+Image'}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700" alt="Room">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-80"></div>
                        <div class="absolute top-4 right-4 flex gap-2">
                             <span class="px-3 py-1 rounded-full text-xs font-bold text-white backdrop-blur-md ${r.Status === 'ว่าง' ? 'bg-green-500/80' : (r.Status === 'จองแล้ว' ? 'bg-red-500/80' : 'bg-slate-500/80')} shadow-lg border border-white/20">${r.Status}</span>
                        </div>
                        <div class="absolute bottom-4 left-4 text-white">
                            <p class="text-xs font-bold bg-white/20 backdrop-blur-md px-2 py-0.5 rounded-lg inline-block mb-1 border border-white/30">${r.Type}</p>
                            <h3 class="text-3xl font-extrabold tracking-tight">ห้อง ${r.Room_No}</h3>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-end mb-4 border-b border-slate-50 pb-4">
                            <div class="text-slate-500 text-sm line-clamp-2 pr-2">${r.Detail || 'ไม่มีรายละเอียด'}</div>
                            <div class="font-bold text-violet-600 text-xl whitespace-nowrap">฿${Number(r.Rate).toLocaleString()}</div>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="editRoom('${r.Room_No}')" class="py-2.5 rounded-xl bg-slate-800 text-white text-sm font-bold hover:bg-slate-700 shadow-md transition flex items-center justify-center gap-2"><i class="fa-solid fa-pen-to-square"></i> <span class="hidden sm:inline">แก้ไข</span></button>
                            <button onclick="toggleRoomStatus('${r.Room_No}')" class="py-2.5 rounded-xl bg-orange-50 text-orange-600 text-sm font-bold hover:bg-orange-100 border border-orange-100 transition flex items-center justify-center gap-2"><i class="fa-solid fa-rotate"></i> <span class="hidden sm:inline">สถานะ</span></button>
                            <button onclick="deleteRoom('${r.Room_No}')" class="py-2.5 rounded-xl bg-red-50 text-red-500 hover:bg-red-100 hover:text-red-600 border border-red-100 transition flex items-center justify-center"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // --- แก้ไขจุดที่ 1: Toggle Room Status รูปหาย ---
        async function toggleRoomStatus(no) {
            const room = allRooms.find(r => r.Room_No === no);
            const next = room.Status === 'ว่าง' ? 'จองแล้ว' : 'ว่าง';
            
            // สร้าง Payload ให้ครบถ้วนเหมือน Submit Form เพื่อไม่ให้รูปภาพหาย
            const payload = {
                roomNo: room.Room_No,
                type: room.Type,
                rate: room.Rate,
                status: next,
                detail: room.Detail,
                image1: room.Image1, // ส่งรูปเดิมกลับไป
                image2: room.Image2,
                image3: room.Image3,
                image4: room.Image4
            };

            try {
                const res = await fetch(`/api/admin/rooms/${no}`, {
                    method: 'PUT', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify(payload)
                });
                if((await res.json()).success) { 
                    showToast('สถานะอัปเดตแล้ว', 'success'); 
                    loadRooms(); 
                    loadStats(); 
                }
            } catch(e) { 
                showToast('Error updating status', 'error'); 
            }
        }

        document.getElementById('roomNo').addEventListener('input', function() {
            const val = this.value.trim();
            const icon = document.getElementById('roomNoIcon');
            const feedback = document.getElementById('roomNoFeedback');
            const btnSave = document.getElementById('btnSaveRoom');

            if (!val) {
                icon.classList.add('hidden');
                feedback.textContent = '';
                this.classList.remove('border-green-500', 'border-red-500', 'bg-green-50', 'bg-red-50');
                isRoomNoValid = false;
                return;
            }

            const exists = allRooms.some(r => r.Room_No === val);
            const isSelf = editingRoomOriginalID && editingRoomOriginalID === val;

            icon.classList.remove('hidden', 'text-green-500', 'text-red-500', 'fa-circle-check', 'fa-circle-xmark');
            this.classList.remove('border-green-500', 'border-red-500', 'bg-green-50', 'bg-red-50');

            if (exists && !isSelf) {
                icon.classList.add('fa-circle-xmark', 'text-red-500');
                this.classList.add('border-red-500', 'bg-red-50');
                feedback.textContent = `❌ หมายเลขห้อง ${val} มีอยู่ในระบบแล้ว`;
                feedback.className = 'text-xs min-h-[1.25rem] font-medium transition-all text-red-500 mt-1';
                isRoomNoValid = false;
                btnSave.disabled = true;
            } else {
                icon.classList.add('fa-circle-check', 'text-green-500');
                this.classList.add('border-green-500', 'bg-green-50');
                feedback.textContent = `✅ สามารถใช้หมายเลขห้องนี้ได้`;
                feedback.className = 'text-xs min-h-[1.25rem] font-medium transition-all text-green-500 mt-1';
                isRoomNoValid = true;
                btnSave.disabled = false;
            }
        });

        function showAddRoomModal() {
            editingRoomOriginalID = null;
            document.getElementById('roomModalTitle').textContent = 'เพิ่มห้องพักใหม่';
            document.getElementById('roomForm').reset();
            
            document.getElementById('roomNo').disabled = false;
            document.getElementById('roomNo').classList.remove('border-green-500', 'border-red-500', 'bg-green-50', 'bg-red-50');
            document.getElementById('roomNoIcon').classList.add('hidden');
            document.getElementById('roomNoFeedback').textContent = '';
            isRoomNoValid = false; 

            const modal = document.getElementById('roomModal');
            const content = document.getElementById('roomModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function editRoom(no) {
            const r = allRooms.find(item => item.Room_No === no);
            if(!r) return;
            
            showAddRoomModal();
            editingRoomOriginalID = no;
            document.getElementById('roomModalTitle').textContent = `แก้ไขห้องพัก ${no}`;
            document.getElementById('roomNo').value = r.Room_No;
            document.getElementById('roomNo').disabled = false;
            
            document.getElementById('roomType').value = r.Type;
            document.getElementById('roomRate').value = r.Rate;
            document.getElementById('roomStatus').value = r.Status;
            document.getElementById('roomDetail').value = r.Detail || '';
            document.getElementById('roomImage1').value = r.Image1 || '';
            document.getElementById('roomImage2').value = r.Image2 || '';
            document.getElementById('roomImage3').value = r.Image3 || '';
            document.getElementById('roomImage4').value = r.Image4 || '';

            document.getElementById('roomNo').dispatchEvent(new Event('input'));
        }

        function closeRoomModal() {
            const modal = document.getElementById('roomModal');
            const content = document.getElementById('roomModalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function submitRoomForm() {
            const newRoomNo = document.getElementById('roomNo').value;
            if(!isRoomNoValid && !editingRoomOriginalID) { showToast('กรุณาตรวจสอบหมายเลขห้อง', 'error'); return; }

            const data = {
                roomNo: newRoomNo,
                type: document.getElementById('roomType').value,
                rate: document.getElementById('roomRate').value,
                status: document.getElementById('roomStatus').value,
                detail: document.getElementById('roomDetail').value,
                image1: document.getElementById('roomImage1').value,
                image2: document.getElementById('roomImage2').value,
                image3: document.getElementById('roomImage3').value,
                image4: document.getElementById('roomImage4').value
            };

            if(!data.roomNo || !data.rate) { showToast('ข้อมูลไม่ครบถ้วน', 'error'); return; }

            const method = editingRoomOriginalID ? 'PUT' : 'POST';
            const url = editingRoomOriginalID ? `/api/admin/rooms/${editingRoomOriginalID}` : '/api/admin/rooms';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(d => {
                if(d.success) {
                    showToast('บันทึกข้อมูลเรียบร้อย', 'success');
                    closeRoomModal();
                    loadRooms();
                    loadStats();
                } else {
                    showToast(d.message, 'error');
                }
            })
            .catch(err => {
                showToast('การเชื่อมต่อล้มเหลว', 'error');
            });
        }

        async function deleteRoom(no) {
            if(!confirm(`⚠️ คำเตือน: ต้องการลบห้อง ${no} อย่างถาวรใช่หรือไม่?`)) return;
            try {
                await fetch(`/api/admin/rooms/${no}`, { method: 'DELETE' });
                showToast(`ลบห้อง ${no} แล้ว`, 'success'); loadRooms(); loadStats();
            } catch(e) { showToast('ลบไม่สำเร็จ', 'error'); }
        }

        // --- USERS ---
        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const data = await res.json();
                if(data.success) { allUsers = data.users; renderUsersTable(allUsers); }
            } catch(e) { console.error(e); }
        }

        function filterUsers() {
            const q = document.getElementById('userSearch').value.toLowerCase();
            const filtered = allUsers.filter(u => u.User_ID.toLowerCase().includes(q) || u.Name.toLowerCase().includes(q) || (u.Mail && u.Mail.toLowerCase().includes(q)));
            renderUsersTable(filtered);
        }

        // --- แก้ไขจุดที่ 2: เพิ่มการแสดงผล Email ---
        function renderUsersTable(list) {
            const container = document.getElementById('usersTable');
            if(list.length === 0) { container.innerHTML = '<div class="p-8 text-center text-slate-400">ไม่พบข้อมูล</div>'; return; }
            let html = `
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-500 text-xs uppercase font-bold">
                        <tr>
                            <th class="p-4">User ID</th>
                            <th class="p-4">ชื่อ-นามสกุล</th>
                            <th class="p-4">อีเมล</th>
                            <th class="p-4">เบอร์โทร</th>
                            <th class="p-4 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody class="text-slate-700 divide-y divide-slate-100">
            `;
            list.forEach(u => {
                html += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 font-bold text-indigo-600">${u.User_ID}</td>
                        <td class="p-4 font-medium flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-400 to-fuchsia-400 text-white flex items-center justify-center font-bold text-xs">${u.Name.charAt(0)}</div>
                            ${u.Name} ${u.LastName}
                        </td>
                        <td class="p-4 text-sm text-slate-600">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-envelope text-slate-400"></i>
                                ${u.Mail || '<span class="text-slate-300">ไม่ระบุ</span>'}
                            </div>
                        </td>
                        <td class="p-4 text-sm font-mono">${u.Tel}</td>
                        <td class="p-4 text-center">
                            <button onclick="deleteUser('${u.User_ID}')" class="w-8 h-8 rounded-lg text-red-400 hover:text-white hover:bg-red-500 transition shadow-sm" title="ลบผู้ใช้"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        async function deleteUser(id) {
            if(!confirm(`ต้องการลบผู้ใช้ ${id}?`)) return;
            try { await fetch(`/api/admin/users/${id}`, { method: 'DELETE' }); showToast('ลบผู้ใช้เรียบร้อย', 'success'); loadUsers(); loadStats(); } 
            catch(e) { showToast('ผิดพลาด', 'error'); }
        }

        async function logout() {
            if(!confirm('ยืนยันออกจากระบบ?')) return;
            try { await fetch('/logout', { method: 'POST' }); window.location.href = '/login.html'; } catch(e){}
        }

        window.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
